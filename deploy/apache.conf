# Reemplazar soporte.example.com por tu dominio. Requiere proxy, proxy_http y headers.
<VirtualHost *:80>
    ServerName soporte.example.com
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:3000/ timeout=40
    ProxyPassReverse / http://127.0.0.1:3000/
    ErrorLog ${APACHE_LOG_DIR}/iturno-error.log
    CustomLog ${APACHE_LOG_DIR}/iturno-access.log combined
</VirtualHost>
# Certbot debe crear el VirtualHost TLS. Dentro del bloque *:443, usar:
# RequestHeader set X-Forwarded-Proto "https"
# ProxyPreserveHost On
# ProxyRequests Off
# ProxyPass / http://127.0.0.1:3000/ timeout=40
# ProxyPassReverse / http://127.0.0.1:3000/
# No publicar el puerto 3000. HOST=127.0.0.1 y TRUST_PROXY=1 en .env.
