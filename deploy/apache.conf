# Adaptar dominio, rutas y socket PHP-FPM a la distribución instalada.
# Requiere módulos rewrite, headers, proxy y proxy_fcgi; PHP 8.2+ con SQLite y cURL.
<VirtualHost *:80>
    ServerName soporte.example.com
    DocumentRoot /opt/iturno-ai/public
    <Directory /opt/iturno-ai/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost/"
    </FilesMatch>
    ErrorLog ${APACHE_LOG_DIR}/iturno-error.log
    CustomLog ${APACHE_LOG_DIR}/iturno-access.log combined
</VirtualHost>
# Emitir HTTPS con Certbot y redirigir HTTP a HTTPS.
# Conservar DocumentRoot, Directory y FilesMatch en el VirtualHost TLS.
# APP_ENV=production activa cookies Secure. No requiere un proceso de aplicación persistente.
